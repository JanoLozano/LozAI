{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LozAI | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="login-page">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">AI</div>
            <div>
                <h1>LozAI</h1>
                <p>Crear nueva cuenta</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>Registro</h2>
            <p>Creá un usuario para acceder al sistema.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="usuario@lozai.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Creá una contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                Crear cuenta
            </button>
        </form>

        <div class="login-footer">
            <span>¿Ya tenés cuenta?</span>
            <a href="{% url 'login' %}">Iniciar sesión</a>
        </div>
    </div>

    <small class="system-version">
        {{ configuracion_sistema.obtener_nombre }} · v{{ configuracion_sistema.obtener_version }}
    </small>
</div>

</body>
</html>
