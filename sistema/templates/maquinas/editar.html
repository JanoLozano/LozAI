<h1>Editar Máquina</h1>

{% if error %}
    <p style="color:red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">
{% csrf_token %}
    <p>
        Nombre:
        <input type="text" name="nombre" value="{{ maquina.nombre }}">
    </p>

    <p>
        IP:
        <input type="text" name="ip" value="{{ maquina.ip }}">
    </p>

    <p>
        Estado:
        <select name="estado">
            <option value="activa" {% if maquina.estado == 'activa' %}selected{% endif %}>Activa</option>
            <option value="inactiva" {% if maquina.estado == 'inactiva' %}selected{% endif %}>Inactiva</option>
        </select>
    </p>

    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'listar_maquinas' %}">Volver</a>
