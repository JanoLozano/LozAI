<h1>Editar Usuario</h1>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>Nombre: <input type="text" name="nombre" value="{{ usuario.nombre }}"></p>
    <p>Email: <input type="email" name="email" value="{{ usuario.email }}"></p>

    <p>
        Rol:
        <select name="role">
            <option value="usuario" {% if usuario.role == 'usuario' %}selected{% endif %}>Usuario</option>
            <option value="tecnico" {% if usuario.role == 'tecnico' %}selected{% endif %}>Técnico</option>
            <option value="admin" {% if usuario.role == 'admin' %}selected{% endif %}>Administrador</option>
        </select>
    </p>

    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'listar_usuarios' %}">Volver</a>
