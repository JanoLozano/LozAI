<h1>Login LozAI</h1>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        Email:
        <input type="email" name="email">
    </p>

    <p>
        Contraseña:
        <input type="password" name="password">
    </p>

    <button type="submit">Ingresar</button>

    <p>
        <a href="{% url 'register' %}">Crear cuenta</a>
    </p>
</form>
